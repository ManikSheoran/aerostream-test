services:
  controller:
    image: quay.io/gradientgeeks/aerostream:latest
    container_name: aerostream-controller
    command:
      - "/app/controller"
      - "-id"
      - "node1"
      - "-raft-addr"
      - "controller:7001"
      - "-grpc-addr"
      - "0.0.0.0:8001"
      - "-http-addr"
      - "0.0.0.0:9001"
      - "-data-dir"
      - "/data"
      - "-bootstrap"
    ports:
      - "7001:7001"
      - "8001:8001"
      - "9001:9001"
    volumes:
      - controller-data:/data
    networks:
      - aeronet

  broker:
    image: quay.io/gradientgeeks/aerostream:latest
    container_name: aerostream-broker
    command:
      - "/app/broker"
      - "--broker-id"
      - "1"
      - "--port"
      - "9092"
      - "--data-dir"
      - "/data"
      - "--controller-addr"
      - "controller:8001"
    ports:
      - "9092:9092"
    volumes:
      - broker-data:/data
    depends_on:
      - controller
    networks:
      - aeronet

volumes:
  controller-data:
  broker-data:

networks:
  aeronet:
    driver: bridge
